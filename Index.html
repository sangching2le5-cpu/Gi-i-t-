/* ============================ 3. STORAGE ============================ */
const STORAGE_KEY = "prepMasteryData_v1";

function defaultState() {
  return {
    completedLessons: [],
    attempts: {},          // questionId: { correct: bool, userAnswer, date }
    tests: [],             // { date, score, total, duration }
    mistakes: {},          // questionId: { question, userAnswer, correctAnswer, explanation, module, level, date }
    prefs: { showVietnamese: true, theme: "light", sound: false },
    streak: { current: 0, lastDate: null },
    lastActivity: null
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    // validate & merge
    const base = defaultState();
    return {
      ...base,
      ...parsed,
      prefs: { ...base.prefs, ...(parsed.prefs || {}) },
      streak: { ...base.streak, ...(parsed.streak || {}) }
    };
  } catch (e) {
    console.warn("Failed to load state, using defaults.", e);
    return defaultState();
  }
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn("Could not save state.", e);
  }
}

/* ============================ 4. HELPERS ============================ */
function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[s]));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalizeAnswer(str) {
  return String(str).trim().toLowerCase().replace(/\s+/g, " ");
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function showToast(msg) {
  const t = $("#toast");
  $("#toastMsg").textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.add("hidden"), 2600);
}

let confirmCallback = null;
function openConfirm(msg, cb) {
  $("#confirmMsg").textContent = msg;
  confirmCallback = cb;
  $("#confirmModal").classList.remove("hidden");
  $("#confirmModal").classList.add("flex");
  $("#confirmOk").focus();
}
function closeConfirm() {
  $("#confirmModal").classList.add("hidden");
  $("#confirmModal").classList.remove("flex");
  confirmCallback = null;
}
$("#confirmOk").addEventListener("click", () => {
  if (typeof confirmCallback === "function") confirmCallback();
  closeConfirm();
});
$$("[data-confirm-cancel]").forEach(el => el.addEventListener("click", closeConfirm));

/* ============================ 5. PROGRESS ============================ */
function totalQuestions() { return QUESTIONS.length; }

function answeredCount() {
  return Object.keys(state.attempts).length;
}

function correctCount() {
  return Object.values(state.attempts).filter(a => a.correct).length;
}

function accuracy() {
  const a = answeredCount();
  return a === 0 ? 0 : Math.round((correctCount() / a) * 100);
}

function accuracyByModule() {
  const map = {};
  Object.entries(state.attempts).forEach(([id, att]) => {
    const q = QUESTIONS.find(q => q.id === id);
    if (!q) return;
    if (!map[q.module]) map[q.module] = { correct: 0, total: 0 };
    map[q.module].total++;
    if (att.correct) map[q.module].correct++;
  });
  Object.keys(map).forEach(k => {
    map[k].pct = map[k].total ? Math.round((map[k].correct / map[k].total) * 100) : 0;
  });
  return map;
}

function recordAttempt(q, userAnswer, isCorrect) {
  state.attempts[q.id] = {
    correct: isCorrect,
    userAnswer: userAnswer,
    date: new Date().toISOString()
  };
  if (!isCorrect) {
    state.mistakes[q.id] = {
      question: q.question,
      userAnswer: userAnswer,
      correctAnswer: Array.isArray(q.answer) ? q.answer.join(" / ") : q.answer,
      explanation: q.explanation,
      vietnameseExplanation: q.vietnameseExplanation || "",
      module: q.module,
      level: q.level,
      type: q.type,
      date: new Date().toISOString()
    };
  } else {
    // remove from mistakes if now correct
    if (state.mistakes[q.id]) delete state.mistakes[q.id];
  }
  // streak
  const today = todayStr();
  if (state.streak.lastDate !== today) {
    if (state.streak.lastDate) {
      const last = new Date(state.streak.lastDate);
      const diff = Math.round((new Date(today) - last) / 86400000);
      state.streak.current = diff === 1 ? state.streak.current + 1 : 1;
    } else {
      state.streak.current = 1;
    }
    state.streak.lastDate = today;
  }
  state.lastActivity = new Date().toISOString();
  saveState();
}

function markLessonComplete(lessonId) {
  if (!state.completedLessons.includes(lessonId)) {
    state.completedLessons.push(lessonId);
    saveState();
  }
}

const NAV_ITEMS = [
  { id:"dashboard", label:"Dashboard", icon:"📊" },
  { id:"lessons",   label:"Grammar Lessons", icon:"📚" },
  { id:"practice",  label:"Practice Centre", icon:"✏️" },

  { id:"progress",  label:"Progress", icon:"📈" },
  { id:"settings",  label:"Settings", icon:"⚙️" }
];

let currentView = "dashboard";

function renderNav() {
  const desktop = $("#desktopNav");
  const mobile = $("#mobileNavList");
  const build = (container) => {
    container.innerHTML = NAV_ITEMS.map(item => `
      <button class="nav-item w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-100 focus-ring ${currentView===item.id?'active':''}"
        data-nav="${item.id}">
        <span aria-hidden="true">${item.icon}</span>
        <span>${item.label}</span>
      </button>
    `).join("");
    container.querySelectorAll("[data-nav]").forEach(btn => {
      btn.addEventListener("click", () => {
        navigate(btn.dataset.nav);
        closeMobileNav();
      });
    });
  };
  build(desktop);
  build(mobile);
}

function navigate(view) {
  currentView = view;
  renderNav();
  const main = $("#view");
  main.innerHTML = "";
  main.focus();
  switch (view) {
    case "dashboard": renderDashboard(); break;
    case "lessons": renderLessons(); break;
    case "practice": renderPracticeCentre(); break;
    case "test": renderTestSetup(); break;
    case "mistakes": renderMistakes(); break;
    case "progress": renderProgress(); break;
    case "settings": renderSettings(); break;
    default: renderDashboard();
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================ 9. QUESTION RENDERING ============================ */
function renderQuestionHTML(q, idx, context) {
  const num = idx + 1;
  let inputHTML = "";

  if (q.type === "mcq" || q.type === "choose" || q.type === "error") {
    const opts = q.type === "mcq" ? shuffle(q.options) : q.options;
    inputHTML = `
      <div class="space-y-2 mt-3" role="radiogroup" aria-label="Answer options">
        ${opts.map((opt, i) => `
          <button type="button" class="option-btn w-full text-left border border-slate-200 rounded-xl px-4 py-3 text-sm focus-ring"
            data-option="${escapeHtml(opt)}" data-qid="${q.id}">
            <span class="font-semibold text-slate-400 mr-2">${String.fromCharCode(65+i)}.</span>
            ${escapeHtml(opt)}
          </button>
        `).join("")}
      </div>
    `;
  } else if (q.type === "fill") {
    inputHTML = `
      <div class="mt-3 flex flex-col sm:flex-row gap-2">
        <label class="sr-only" for="fib-${q.id}">Your answer</label>
        <input id="fib-${q.id}" type="text" class="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-sm focus-ring" placeholder="Type the missing preposition" data-qid="${q.id}" autocomplete="off" />
        <button type="button" class="focus-ring px-5 py-3 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700" data-submit-fib="${q.id}">Check</button>
      </div>
    `;
  } else if (q.type === "match") {
    const left = shuffle(q.pairs.map(p => p[0]));
    const right = shuffle(q.pairs.map(p => p[1]));
    inputHTML = `
      <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <p class="text-xs font-semibold text-slate-500 mb-2">Column A</p>
          <div class="space-y-2">
            ${left.map((item,i) => `
              <div class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm bg-slate-50" data-match-left="${escapeHtml(item)}">${escapeHtml(item)}</div>
            `).join("")}
          </div>
        </div>
        <div>
          <p class="text-xs font-semibold text-slate-500 mb-2">Column B</p>
          <div class="space-y-2">
            ${right.map((item,i) => `
              <button type="button" class="option-btn w-full text-left border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus-ring" data-match-right="${escapeHtml(item)}" data-qid="${q.id}">${escapeHtml(item)}</button>
            `).join("")}
          </div>
        </div>
      </div>
      <p class="text-xs text-slate-400 mt-2">Tap a word in Column A, then its match in Column B.</p>
    `;
  } else if (q.type === "transform" || q.type === "translation") {
    inputHTML = `
      <div class="mt-3">
        <label class="sr-only" for="open-${q.id}">Your answer</label>
        <textarea id="open-${q.id}" rows="2" class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus-ring" placeholder="Write your answer…" data-qid="${q.id}"></textarea>
        <button type="button" class="focus-ring mt-2 px-5 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700" data-submit-open="${q.id}">Check</button>
      </div>
    `;
  } else if (q.type === "context") {
    inputHTML = `
      <div class="mt-3">
        <label class="sr-only" for="ctx-${q.id}">Your answers, separated by commas</label>
        <textarea id="ctx-${q.id}" rows="3" class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus-ring" placeholder="Type the missing prepositions in order, separated by commas" data-qid="${q.id}"></textarea>
        <button type="button" class="focus-ring mt-2 px-5 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700" data-submit-open="${q.id}">Check</button>
      </div>
    `;
  }

  return `
    <div class="border border-slate-200 rounded-xl p-4 mb-4" data-question="${q.id}" data-context="${context}">
      <div class="flex items-center gap-2 mb-2 flex-wrap">
        <span class="text-xs font-semibold text-slate-400">Q${num}</span>
        <span class="badge badge-module">${q.module}</span>
        <span class="badge ${q.level==="B1"?"badge-b1":"badge-b2"}">${q.level}</span>
      </div>
      <p class="text-sm font-medium text-slate-800">${escapeHtml(q.question)}</p>
      ${inputHTML}
      <div class="feedback mt-3 hidden" aria-live="polite"></div>
    </div>
  `;
}

function attachQuestionHandlers(container, questions, onAnswered, context) {
  const matchState = {};

  // MCQ / choose / error
  container.querySelectorAll("[data-option]").forEach(btn => {
    btn.addEventListener("click", () => {
      const qid = btn.dataset.qid;
      const q = questions.find(x => x.id === qid);
      if (!q) return;
      const parent = btn.closest("[data-question]");
      if (parent.dataset.answered === "true") return;
      const chosen = btn.dataset.option;
      const isCorrect = normalizeAnswer(chosen) === normalizeAnswer(q.answer);
      // visual
      parent.querySelectorAll("[data-option]").forEach(b => {
        b.classList.remove("option-selected","option-correct","option-wrong");
        if (b.dataset.option === q.answer) b.classList.add("option-correct");
      });
      if (!isCorrect) btn.classList.add("option-wrong");
      parent.dataset.answered = "true";
      showFeedback(parent, q, chosen, isCorrect);
      recordAttempt(q, chosen, isCorrect);
      if (onAnswered) onAnswered(q, isCorrect, chosen);
    });
  });

  // Fill
  container.querySelectorAll("[data-submit-fib]").forEach(btn => {
    btn.addEventListener("click", () => {
      const qid = btn.dataset.submitFib;
      const q = questions.find(x => x.id === qid);
      if (!q) return;
      const parent = btn.closest("[data-question]");
      if (parent.dataset.answered === "true") return;
      const input = parent.querySelector(`#fib-${qid}`);
      const val = input.value;
      const accepted = Array.isArray(q.answer) ? q.answer : [q.answer];
      const isCorrect = accepted.some(a => normalizeAnswer(a) === normalizeAnswer(val));
      parent.dataset.answered = "true";
      input.disabled = true;
      btn.disabled = true;
      showFeedback(parent, q, val, isCorrect);
      recordAttempt(q, val, isCorrect);
      if (onAnswered) onAnswered(q, isCorrect, val);
    });
  });

  // Open (transform / translation / context)
  container.querySelectorAll("[data-submit-open]").forEach(btn => {
    btn.addEventListener("click", () => {
      const qid = btn.dataset.submitOpen;
      const q = questions.find(x => x.id === qid);
      if (!q) return;
      const parent = btn.closest("[data-question]");
      if (parent.dataset.answered === "true") return;
      const ta = parent.querySelector(`#open-${qid}, #ctx-${qid}`);
      const val = ta.value;
      const accepted = Array.isArray(q.answer) ? q.answer : [q.answer];
      let isCorrect = accepted.some(a => normalizeAnswer(a) === normalizeAnswer(val));
      if (q.type === "context") {
        // compare comma separated
        const userParts = val.split(",").map(s => normalizeAnswer(s));
        const correctParts = accepted[0].split(",").map(s => normalizeAnswer(s));
        isCorrect = userParts.length === correctParts.length && userParts.every((p,i) => p === correctParts[i]);
      }
      parent.dataset.answered = "true";
      ta.disabled = true;
      btn.disabled = true;
      showFeedback(parent, q, val, isCorrect, true);
      recordAttempt(q, val, isCorrect);
      if (onAnswered) onAnswered(q, isCorrect, val);
    });
  });

  // Matching
  const matchLefts = container.querySelectorAll("[data-match-left]");
  matchLefts.forEach(el => {
    el.addEventListener("click", () => {
      matchLefts.forEach(x => x.classList.remove("option-selected"));
      el.classList.add("option-selected");
      matchState.selected = el.dataset.matchLeft;
    });
  });
  container.querySelectorAll("[data-match-right]").forEach(btn => {
    btn.addEventListener("click", () => {
      const qid = btn.dataset.qid;
      const q = questions.find(x => x.id === qid);
      if (!q) return;
      if (!matchState.selected) { showToast("Select an item from Column A first."); return; }
      const parent = btn.closest("[data-question]");
      if (parent.dataset.answered === "true") return;
      // find expected pair
      const pair = q.pairs.find(p => p[0] === matchState.selected);
      const isCorrect = pair && pair[1] === btn.dataset.matchRight;
      // visual
      const leftEl = parent.querySelector(`[data-match-left="${CSS.escape(matchState.selected)}"]`);
      if (leftEl) {
        leftEl.classList.remove("option-selected");
        leftEl.classList.add(isCorrect ? "option-correct" : "option-wrong");
      }
      btn.classList.add(isCorrect ? "option-correct" : "option-wrong");
      if (!isCorrect) {
        showFeedback(parent, q, matchState.selected + " → " + btn.dataset.matchRight, false);
      }
      // check if all matched correctly
      const allLeft = parent.querySelectorAll("[data-match-left]");
      const allRight = parent.querySelectorAll("[data-match-right]");
      const correctCount = parent.querySelectorAll(".option-correct").length;
      if (correctCount >= q.pairs.length * 2) {
        parent.dataset.answered = "true";
        showFeedback(parent, q, "All matched", true);
        recordAttempt(q, "matched", true);
        if (onAnswered) onAnswered(q, true, "matched");
      }
      matchState.selected = null;
    });
  });
}

function showFeedback(parent, q, userAnswer, isCorrect, openEnded = false) {
  const fb = parent.querySelector(".feedback");
  if (!fb) return;
  fb.classList.remove("hidden");
  const correctAnswer = Array.isArray(q.answer) ? q.answer.join(" / ") : q.answer;
  let html = "";
  if (isCorrect) {
    html += `<div class="flex items-start gap-2 text-green-700 bg-green-50 border border-green-200 rounded-lg p-3 text-sm">
      <span aria-hidden="true">✓</span>
      <div><p class="font-semibold">Correct.</p><p class="mt-0.5">${escapeHtml(q.explanation)}</p>`;
  } else {
    html += `<div class="flex items-start gap-2 text-red-700 bg-red-50 border border-red-200 rounded-lg p-3 text-sm">
      <span aria-hidden="true">✗</span>
      <div><p class="font-semibold">Not quite.</p>
      <p class="mt-0.5"><strong>Correct answer:</strong> ${escapeHtml(correctAnswer)}</p>
      <p class="mt-0.5">${escapeHtml(q.explanation)}</p>`;
  }
  if (state.prefs.showVietnamese && q.vietnameseExplanation) {
    html += `<p class="mt-1 italic text-slate-600">${escapeHtml(q.vietnameseExplanation)}</p>`;
  }
  if (openEnded && !isCorrect) {
    html += `<p class="mt-2 text-xs">This is a model answer. Compare with your own and self-evaluate.</p>`;
  }
  html += `</div></div>`;
  fb.innerHTML = html;
}

function startPractice(opts) {
  let pool = QUESTIONS.slice();
  if (opts.module && opts.module !== "all") pool = pool.filter(q => q.module === opts.module);
  if (opts.level && opts.level !== "Mixed" && opts.level !== "all") pool = pool.filter(q => q.level === opts.level);
  if (opts.random) pool = shuffle(pool);
  const count = opts.count || 10;
  pool = shuffle(pool).slice(0, count);
  if (pool.length === 0) { showToast("No questions match these filters."); return; }

  renderPracticeRunner(pool, opts.module || "All modules", opts.level || "Mixed");
}

function renderPracticeRunner(questions, moduleLabel, levelLabel) {
  const runner = $("#practiceRunner");
  let answered = 0;
  const total = questions.length;
  const localAnswers = {};

  runner.innerHTML = `

      <div class="flex items-center justify-between flex-wrap gap-2">

  const updateProgress = () => {
    $("#practiceProgress").textContent = `${answered} / ${total}`;

  };

  attachQuestionHandlers($("#practiceQuestions"), questions, (q, isCorrect, userAnswer) => {
    if (!localAnswers[q.id]) {
      answered++;

      updateProgress();

  runner.querySelector("[data-nav]").addEventListener("click", () => navigate("practice"));
  $("#finishPractice").addEventListener("click", () => {

      <div class="card p-4 mb-4 flex items-center justify-between flex-wrap gap-3 sticky top-16 md:top-0 z-30">
        <div>
          <p class="text-xs text-slate-500">Question ${testState.current+1} of ${total}</p>
          <p class="font-bold">Mixed Test</p>
        </div>
        <div class="flex items-center gap-3">
          <span id="testTimer" class="font-mono font-bold text-brand-700 text-lg" aria-live="polite">30:00</span>
          <button id="submitTest" class="focus-ring px-4 py-2 rounded-lg bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700">Submit</button>
        </div>
      </div>

      <div id="testQuestionArea">
        ${renderTestQuestion(q)}
      </div>

      <div class="flex justify-between items-center mt-6">
        <button id="prevQ" class="focus-ring px-5 py-2.5 rounded-xl border border-slate-300 font-semibold hover:bg-slate-50" ${testState.current===0?"disabled":""}>← Previous</button>
        <span class="text-sm text-slate-500">${Object.keys(testState.answers).length} answered</span>
        <button id="nextQ" class="focus-ring px-5 py-2.5 rounded-xl border border-slate-300 font-semibold hover:bg-slate-50" ${testState.current===total-1?"disabled":""}>Next →</button>
      </div>
    </div>
  `;

  $("#prevQ").addEventListener("click", () => { if (testState.current>0){ testState.current--; renderTestRunner(); }});
  $("#nextQ").addEventListener("click", () => { if (testState.current<total-1){ testState.current++; renderTestRunner(); }});
  $("#submitTest").addEventListener("click", () => {
    openConfirm("Submit the test now? You have answered " + Object.keys(testState.answers).length + " of " + total + " questions.", submitTest);
  });

  attachTestHandlers(q);
  startTestTimer();
}

function renderTestQuestion(q) {
  let inputHTML = "";
  if (q.type === "mcq" || q.type === "choose" || q.type === "error") {
    const opts = q.type === "mcq" ? shuffle(q.options) : q.options;
    inputHTML = `
      <div class="space-y-2 mt-3" role="radiogroup">
        ${opts.map((opt,i) => {
          const selected = testState.answers[q.id] === opt;
          return `<button type="button" class="option-btn w-full text-left border ${selected?"option-selected":"border-slate-200"} rounded-xl px-4 py-3 text-sm focus-ring" data-test-option="${escapeHtml(opt)}" data-qid="${q.id}">
            <span class="font-semibold text-slate-400 mr-2">${String.fromCharCode(65+i)}.</span>${escapeHtml(opt)}
          </button>`;
        }).join("")}
      </div>`;
  } else if (q.type === "fill") {
    inputHTML = `
      <div class="mt-3">
        <input id="test-fib-${q.id}" type="text" class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus-ring" placeholder="Type your answer" value="${escapeHtml(testState.answers[q.id]||"")}" data-test-fib="${q.id}" />
      </div>`;
  } else {
    inputHTML = `
      <div class="mt-3">
        <textarea id="test-open-${q.id}" rows="2" class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus-ring" placeholder="Write your answer" data-test-open="${q.id}">${escapeHtml(testState.answers[q.id]||"")}</textarea>
      </div>`;
  }
  return `
    <div class="card p-5" data-question="${q.id}">
      <div class="flex items-center gap-2 mb-2 flex-wrap">
        <span class="badge badge-module">${q.module}</span>
        <span class="badge ${q.level==="B1"?"badge-b1":"badge-b2"}">${q.level}</span>
      </div>
      <p class="text-base font-medium">${escapeHtml(q.question)}</p>
      ${inputHTML}
    </div>
  `;
}

function attachTestHandlers(q) {
  const area = $("#testQuestionArea");
  area.querySelectorAll("[data-test-option]").forEach(btn => {
    btn.addEventListener("click", () => {
      testState.answers[q.id] = btn.dataset.testOption;
      renderTestRunner();
    });
  });
  const fib = area.querySelector("[data-test-fib]");
  if (fib) fib.addEventListener("input", () => { testState.answers[q.id] = fib.value; });
  const open = area.querySelector("[data-test-open]");
  if (open) open.addEventListener("input", () => { testState.answers[q.id] = open.value; });
}

function startTestTimer() {
  clearInterval(testTimerInterval);
  const tick = () => {
    if (!testState || testState.submitted) { clearInterval(testTimerInterval); return; }
    const elapsed = Math.floor((Date.now() - testState.startTime) / 1000);
    const remaining = Math.max(0, testState.duration - elapsed);
    const m = String(Math.floor(remaining / 60)).padStart(2, "0");
    const s = String(remaining % 60).padStart(2, "0");
    const el = $("#testTimer");
    if (el) el.textContent = `${m}:${s}`;
    if (remaining <= 0) {
      clearInterval(testTimerInterval);
      submitTest(true);
    }
  };
  tick();
  testTimerInterval = setInterval(tick, 1000);
}

function submitTest(auto = false) {
  if (!testState || testState.submitted) return;
  testState.submitted = true;
  clearInterval(testTimerInterval);

  let correct = 0;
  testState.questions.forEach(q => {
    const userAns = testState.answers[q.id] || "";
    const accepted = Array.isArray(q.answer) ? q.answer : [q.answer];
    let isCorrect = false;
    if (q.type === "mcq" || q.type === "choose" || q.type === "error") {
      isCorrect = normalizeAnswer(userAns) === normalizeAnswer(q.answer);
    } else if (q.type === "fill") {
      isCorrect = accepted.some(a => normalizeAnswer(a) === normalizeAnswer(userAns));
    } else {
      isCorrect = accepted.some(a => normalizeAnswer(a) === normalizeAnswer(userAns));
    }
    if (isCorrect) correct++;
    recordAttempt(q, userAns, isCorrect);
  });

  const score = Math.round((correct / testState.questions.length) * 100);
  state.tests.push({
    date: new Date().toISOString(),
    score: score,
    correct: correct,
    total: testState.questions.length,
    duration: Math.floor((Date.now() - testState.startTime) / 1000)
  });
  saveState();

  renderTestResults(correct, testState.questions.length, score, auto);
}

function renderTestResults(correct, total, score, auto) {
  $("#view").innerHTML = `
    <div class="fade-in max-w-2xl mx-auto text-center">
      <div class="card p-8">
        <p class="text-sm text-slate-500">${auto?"Time expired — test submitted automatically.":"Test submitted."}</p>
        <h2 class="text-3xl font-bold mt-2">${score}%</h2>
        <p class="text-slate-600 mt-1">${correct} / ${total} correct</p>
        <div class="progress-track mt-4 max-w-xs mx-auto"><div class="progress-fill" style="width:${score}%"></div></div>
        <div class="flex flex-wrap gap-3 justify-center mt-6">
          <button class="focus-ring px-5 py-2.5 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700" data-nav="dashboard">Dashboard</button>
          <button class="focus-ring px-5 py-2.5 rounded-xl border border-slate-300 font-semibold hover:bg-slate-50" data-nav="mistakes">Review mistakes</button>
          <button class="focus-ring px-5 py-2.5 rounded-xl border border-slate-300 font-semibold hover:bg-slate-50" data-nav="test">New test</button>
        </div>
      </div>
    </div>
  `;
  $("#view").querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => navigate(b.dataset.nav)));
}

/* ============================ 12. MISTAKES REVIEW ============================ */
function renderMistakes() {
  const mistakes = Object.entries(state.mistakes);
  $("#view").innerHTML = `
    <div class="fade-in">
      <h2 class="text-2xl font-bold mb-1">Mistakes Review</h2>
      <p class="text-slate-500 text-sm mb-6">Review the questions you answered incorrectly and try them again.</p>
      ${mistakes.length === 0 ? `
        <div class="card p-8 text-center">
          <p class="text-4xl mb-2" aria-hidden="true">🎉</p>
          <p class="font-semibold">No mistakes recorded.</p>
          <p class="text-sm text-slate-500 mt-1">Keep practising to maintain your accuracy.</p>
        </div>
      ` : `
        <div class="space-y-4">
          ${mistakes.map(([id, m]) => {
            const q = QUESTIONS.find(x => x.id === id);
            if (!q) return "";
            return `
              <div class="card p-4">
                <div class="flex items-center gap-2 mb-2 flex-wrap">
                  <span class="badge badge-module">${m.module}</span>
                  <span class="badge ${m.level==="B1"?"badge-b1":"badge-b2"}">${m.level}</span>
                </div>
                <p class="text-sm font-medium">${escapeHtml(m.question)}</p>
                <p class="text-sm mt-2 text-red-600">Your answer: <strong>${escapeHtml(m.userAnswer)}</strong></p>
                <p class="text-sm text-green-700">Correct: <strong>${escapeHtml(m.correctAnswer)}</strong></p>
                <p class="text-xs text-slate-500 mt-1">${escapeHtml(m.explanation)}</p>
                <div class="flex gap-2 mt-3">
                  <button class="focus-ring px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs font-semibold hover:bg-brand-700" data-retry="${id}">Retry</button>
                  <button class="focus-ring px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold hover:bg-slate-50" data-remove="${id}">Remove from review</button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `}
    </div>
  `;

  $("#view").querySelectorAll("[data-retry]").forEach(b => {
    b.addEventListener("click", () => {
      const q = QUESTIONS.find(x => x.id === b.dataset.retry);
      if (q) startPractice({ count: 1, random: false, _single: q });
    });
  });
  $("#view").querySelectorAll("[data-remove]").forEach(b => {
    b.addEventListener("click", () => {
      delete state.mistakes[b.dataset.remove];
      saveState();
      renderMistakes();
    });
  });
}

/* ============================ 13. PROGRESS ============================ */
function renderProgress() {
  const byModule = accuracyByModule();
  const tests = state.tests.slice(-5).reverse();
  $("#view").innerHTML = `
    <div class="fade-in">
      <h2 class="text-2xl font-bold mb-1">Progress</h2>
      <p class="text-slate-500 text-sm mb-6">Your learning statistics, stored locally in your browser.</p>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="card p-5 text-center">
          <p class="text-3xl font-bold text-brand-700">${accuracy()}%</p>
          <p class="text-xs text-slate-500 mt-1">Overall accuracy</p>
        </div>
        <div class="card p-5 text-center">
          <p class="text-3xl font-bold text-brand-700">${answeredCount()}</p>
          <p class="text-xs text-slate-500 mt-1">Questions answered</p>
        </div>
        <div class="card p-5 text-center">
          <p class="text-3xl font-bold text-brand-700">${state.tests.length}</p>
          <p class="text-xs text-slate-500 mt-1">Tests completed</p>
        </div>
      </div>

      <div class="card p-5 mb-6">
        <h3 class="font-semibold mb-3">Accuracy by module</h3>
        ${Object.keys(byModule).length === 0 ? `<p class="text-sm text-slate-400">No data yet.</p>` :
          Object.entries(byModule).map(([mod,d]) => `
            <div class="mb-3">
              <div class="flex justify-between text-sm mb-1"><span>${mod}</span><span class="font-semibold">${d.pct}%</span></div>
              <div class="progress-track"><div class="progress-fill" style="width:${d.pct}%"></div></div>
            </div>
          `).join("")}
      </div>

      <div class="card p-5">
        <h3 class="font-semibold mb-3">Recent test scores</h3>
        ${tests.length === 0 ? `<p class="text-sm text-slate-400">No tests yet.</p>` :
          tests.map(t => `
            <div class="flex justify-between items-center text-sm py-2 border-b border-slate-100 last:border-0">
              <span class="text-slate-500">${new Date(t.date).toLocaleDateString()}</span>
              <span class="font-semibold ${t.score>=70?"text-green-600":t.score>=40?"text-amber-600":"text-red-600"}">${t.score}%</span>
              <span class="text-slate-400 text-xs">${t.correct}/${t.total}</span>
            </div>
          `).join("")}
      </div>
    </div>
  `;
}

/* ============================ 14. SETTINGS ============================ */
function renderSettings() {
  $("#view").innerHTML = `
    <div class="fade-in max-w-2xl">
      <h2 class="text-2xl font-bold mb-1">Settings</h2>
      <p class="text-slate-500 text-sm mb-6">Preferences and data management.</p>

      <div class="card p-5 mb-5">
        <h3 class="font-semibold mb-4">Display</h3>
        <label class="flex items-center justify-between py-2">
          <span class="text-sm">Show Vietnamese explanations</span>
          <input type="checkbox" id="prefVietnamese" class="w-5 h-5 accent-brand-600" ${state.prefs.showVietnamese?"checked":""}>
        </label>
        <label class="flex items-center justify-between py-2">
          <span class="text-sm">Dark theme</span>
          <input type="checkbox" id="prefDark" class="w-5 h-5 accent-brand-600" ${state.prefs.theme==="dark"?"checked":""}>
        </label>
        <label class="flex items-center justify-between py-2">
          <span class="text-sm">Sound effects (disabled by default)</span>
          <input type="checkbox" id="prefSound" class="w-5 h-5 accent-brand-600" ${state.prefs.sound?"checked":""}>
        </label>
      </div>

      <div class="card p-5">
        <h3 class="font-semibold mb-4">Data</h3>
        <div class="flex flex-wrap gap-3">
          <button id="exportData" class="focus-ring px-4 py-2 rounded-lg border border-slate-300 text-sm font-semibold hover:bg-slate-50">Export progress (JSON)</button>
          <label class="focus-ring px-4 py-2 rounded-lg border border-slate-300 text-sm font-semibold hover:bg-slate-50 cursor-pointer">
            Import progress
            <input type="file" id="importData" accept="application/json" class="hidden">
          </label>
          <button id="resetData" class="focus-ring px-4 py-2 rounded-lg bg-red-600 text-white text-sm font-semibold hover:bg-red-700">Reset progress</button>
        </div>
      </div>
    </div>
  `;

  $("#prefVietnamese").addEventListener("change", e => {
    state.prefs.showVietnamese = e.target.checked; saveState();
  });
  $("#prefDark").addEventListener("change", e => {
    state.prefs.theme = e.target.checked ? "dark" : "light"; saveState(); applyTheme();
  });
  $("#prefSound").addEventListener("change", e => {
    state.prefs.sound = e.target.checked; saveState();
  });

  $("#exportData").addEventListener("click", exportProgress);
  $("#importData").addEventListener("change", importProgress);
  $("#resetData").addEventListener("click", () => {
    openConfirm("Reset all progress? This cannot be undone.", () => {
      state = defaultState();
      saveState();
      applyTheme();
      showToast("Progress reset.");
      navigate("dashboard");
    });
  });
}

function applyTheme() {
  if (state.prefs.theme === "dark") document.documentElement.classList.add("dark");
  else document.documentElement.classList.remove("dark");
}

function exportProgress() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "prepositions-progress.json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("Progress exported.");
}

function importProgress(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (typeof parsed !== "object" || parsed === null) throw new Error("Invalid data");
      state = { ...defaultState(), ...parsed };
      saveState();
      applyTheme();
      showToast("Progress imported successfully.");
      navigate("dashboard");
    } catch (err) {
      showToast("Invalid file. Import failed.");
    }
  };
  reader.readAsText(file);
}

/* ============================ 15. INIT ============================ */
function init() {
  applyTheme();
  renderNav();
  navigate("dashboard");
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
